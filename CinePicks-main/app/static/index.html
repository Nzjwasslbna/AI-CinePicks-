<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CinePicks — Temukan Film untuk Malam Ini</title>
  <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="3" fill="url(#g1)"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff4d57"/>
              <stop offset="1" stop-color="#b00610"/>
            </linearGradient>
          </defs>
          <circle cx="8" cy="9" r="1.5" fill="#fff" opacity=".9"/>
          <circle cx="8" cy="15" r="1.5" fill="#fff" opacity=".9"/>
          <circle cx="12" cy="12" r="1.5" fill="#fff" opacity=".9"/>
          <circle cx="16" cy="9" r="1.5" fill="#fff" opacity=".9"/>
          <circle cx="16" cy="15" r="1.5" fill="#fff" opacity=".9"/>
        </svg>
        <div class="brand-text">
          <h1>CinePicks</h1>
          <p>Temukan film untuk malam ini</p>
        </div>
      </div>
      <div class="top-right">
        <button type="button" class="list-btn" id="listBtn" title="Watchlist &amp; Favorit">
          <span aria-hidden="true">&#9829;</span> Daftarku <span class="count" id="listCount">0</span>
        </button>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">online</span></div>
      </div>
    </header>

    <section class="hero" id="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <h2>Apa yang ingin kamu tonton?</h2>
        <p>Ceritakan suasana hatimu, genre favorit, atau unggah foto poster — kami carikan filmnya.</p>
        <div class="hero-actions" id="heroActions">
          <button class="chip chip-lg" data-q="surprise me">Kejutan</button>
          <button class="chip chip-lg" data-q="film populer">Trending</button>
          <button class="chip chip-lg" data-q="rekomendasi film indonesia">Indonesia</button>
          <button class="chip chip-lg" data-q="film action terbaik">Action</button>
          <button class="chip chip-lg" data-q="film sedih romantis">Sedih romantis</button>
        </div>
      </div>
    </section>

    <main class="chat" id="chat" aria-live="polite"></main>

    <div class="chips" id="chips">
      <button class="chip" data-q="surprise me">Kejutan</button>
      <button class="chip" data-q="film populer">Trending</button>
      <button class="chip" data-q="rekomendasi film indonesia">Film Indonesia</button>
      <button class="chip" data-q="film action terbaik">Action terbaik</button>
      <button class="chip" data-q="film sedih romantis">Sedih romantis</button>
      <button class="chip" data-q="film horor seram">Horor</button>
      <button class="chip" data-q="mirip Interstellar">Mirip Interstellar</button>
    </div>

    <div class="preview" id="preview" hidden>
      <img id="previewImg" alt="Pratinjau foto">
      <div class="preview-meta">
        <span id="previewName"></span>
        <button type="button" class="preview-x" id="previewClear" aria-label="Hapus foto">&times;</button>
      </div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn" id="uploadBtn" aria-label="Upload foto" title="Upload foto poster">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <input type="text" id="textInput" placeholder="Genre, mood, judul, atau tahun..." aria-label="Pesan">
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Kirim">
        <svg class="send-ico" viewBox="0 0 24 24" width="21" height="21" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
        <span class="spin" hidden></span>
      </button>
    </form>
  </div>
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer-panel" role="dialog" aria-label="Daftar film saya">
      <div class="drawer-head">
        <h3>Daftar saya</h3>
        <button type="button" class="preview-x" id="drawerClose" aria-label="Tutup">&times;</button>
      </div>
      <div class="tabs">
        <button type="button" class="tab on" id="tabWatch">Watchlist <span class="count" id="cntWatch">0</span></button>
        <button type="button" class="tab" id="tabFav">Favorit <span class="count" id="cntFav">0</span></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot">
        <button type="button" class="link-btn" id="drawerClear">Kosongkan daftar ini</button>
      </div>
    </aside>
  </div>
  <script src="/static/app.js?v=10"></script>
</body>
</html>
